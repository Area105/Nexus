<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Nexus — Your apps. Your controls.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b3a"/>
      <stop offset="0.55" stop-color="#0e5550"/>
      <stop offset="1" stop-color="#12a594"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7f5ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7df0dd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7df0dd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1120" cy="-40" r="300" fill="url(#glow)"/>
  <circle cx="90" cy="360" r="240" fill="url(#glow)"/>

  <!-- Logo mark: rounded cube with connected nodes -->
  <g transform="translate(96,84)">
    <rect x="0" y="0" width="152" height="152" rx="36" fill="url(#cube)"/>
    <!-- node links -->
    <g stroke="#0e5550" stroke-width="7" stroke-linecap="round">
      <line x1="46" y1="48" x2="104" y2="40"/>
      <line x1="46" y1="48" x2="58" y2="104"/>
      <line x1="104" y1="40" x2="110" y2="102"/>
      <line x1="58" y1="104" x2="110" y2="102"/>
      <line x1="46" y1="48" x2="110" y2="102"/>
    </g>
    <!-- nodes -->
    <g fill="#0e5550">
      <circle cx="46" cy="48" r="11"/>
      <circle cx="104" cy="40" r="11"/>
      <circle cx="58" cy="104" r="11"/>
      <circle cx="110" cy="102" r="11"/>
    </g>
    <circle cx="78" cy="72" r="8" fill="#12a594"/>
  </g>

  <!-- Wordmark + copy -->
  <text x="288" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff" letter-spacing="1">Nexus</text>
  <text x="292" y="205" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#bdf3e9">Your apps. Your controls.</text>
  <text x="292" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6fff9" fill-opacity="0.85">Your phone, as your PC's control deck — wireless, private, yours.</text>
</svg>
